<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoShare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,700,1,200&display=block" />

    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24;
        }
    </style>
</head>

<body style="margin: 0;">
    <div id="app">
        <header id="topbar">
            <div id="brand">
                <span id="brandIcon" class="material-symbols-rounded">video_call</span>
                <span>VideoShare</span>
            </div>

            <div id="lobbyControls">
                <button id="createLobby">Create lobby</button>
                <input id="joinInput" placeholder="Lobby code or invite link" />
                <button id="joinLobby">Join</button>
            </div>

            <div id="lobbyStatus">
                <span id="members" class="material-symbols-rounded">group</span>
                <span id="membersCount"></span>
                <a id="inviteLink" href="#">Copy invite link</a>
            </div>
        </header>

        <main id="stage">
            <div id="playerContainer"></div>
            <div id="emptyState">
                <button id="dropZone">
                    <span id="dropZoneIcon" class="material-symbols-rounded">upload_file</span>
                    <span>Drop a video to play it</span>
                </button>
            </div>
        </main>
    </div>

    <div id="notice"></div>

    <script src="src/VideoShare.ts" type="module"></script>
</body>

</html>
